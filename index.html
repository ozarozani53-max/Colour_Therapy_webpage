<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Color Therapy</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            font-family: 'Poppins', sans-serif;
            color: white;
            text-align: center;
            overflow: hidden;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            animation: fadeInDown 1s ease forwards;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 40px;
            opacity: 0.9;
            animation: fadeIn 2s ease forwards;
        }

        button {
            background: white;
            color: #764ba2;
            border: none;
            padding: 15px 40px;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            animation: fadeInUp 1.5s ease forwards;
        }

        button:hover {
            background: #764ba2;
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Floating glowing orbs (optional aesthetic touch) */
        .orb {
            position: absolute;
            border-radius: 50%;
            opacity: 0.2;
            filter: blur(80px);
            animation: float 8s ease-in-out infinite;
        }

        .orb1 { width: 200px; height: 200px; background: #ff6b6b; top: 15%; left: 20%; animation-delay: 0s; }
        .orb2 { width: 250px; height: 250px; background: #4ecdc4; bottom: 10%; right: 15%; animation-delay: 2s; }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-30px); }
        }
    </style>
</head>
<body>
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>

    <h1>🌈 Welcome to Color Therapy</h1>
    <p>Discover the color that matches your mood today.</p>
    <button id="startBtn">Begin</button>

    <script>
        // When the button is clicked, redirect to the main page
        document.getElementById('startBtn').addEventListener('click', () => {
            // Smooth transition before redirect
            document.body.style.opacity = '0';
            setTimeout(() => {
                window.location.href = 'main.html';
            }, 800);
        });
    </script>
</body>
</html>
